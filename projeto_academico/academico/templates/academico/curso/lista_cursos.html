{% extends 'academico/base.html' %}

{% block content %}
<h1>Lista de Cursos</h1>

<table border="1" cellpadding="5" cellspacing="3">
  <tr>
    <th>Nome</th>
    <th>-</th>
    <th>X</th>

  </tr>
  {% for curso in cursos %}
  <tr>
    <td>{{ curso.nome }}</td>
    <td><a href="{% url 'editar_curso' curso.id %}">Editar curso</a></td>
    <td><a href="{% url 'excluir_curso' curso.id %}">Excluir curso</a></td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
