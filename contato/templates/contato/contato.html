{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container my-4" style="max-width: 600px;">
    <h1 class="mb-4">Contato</h1>

    <form method="post" novalidate class="border rounded p-4 shadow-sm bg-white">
        {% csrf_token %}
        {{ form|crispy }}

        <div class="d-flex gap-2 mt-3">
            <button type="submit" class="btn btn-primary flex-grow-1">Enviar</button>
            <button type="reset" class="btn btn-outline-secondary flex-grow-1">Limpar</button>
        </div>
    </form>
</div>
{% endblock %}
