{% extends 'base.html' %}

{% block content %}
<style>
    .fixed-width-table {
        min-width: 900px;
    }
</style>

<div class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="h3">Lista de Disciplinas</h2>
    </div>

    <div class="table-responsive shadow-sm rounded" style="overflow-x:auto;">
        <table class="table table-hover align-middle fixed-width-table">
            <thead class="table-primary sticky-top">
                <tr>
                    <th scope="col">Nome</th>
                    <th scope="col">Curso</th>
                    <th scope="col">Vagas</th>
                </tr>
            </thead>
            <tbody>
                {% for disciplina in disciplinas %}
                <tr>
                    <td>{{ disciplina.nome }}</td>
                    <td>{{ disciplina.curso.nome }}</td>
                    <td>{{ disciplina.vagas }}</td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="3" class="text-center text-muted py-4">Nenhuma disciplina cadastrada.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
