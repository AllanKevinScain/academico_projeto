{% extends 'base.html' %}

{% block content %}
<div class="container my-4" style="max-width: 700px;">
    <h2 class="mb-4">Selecionar Aluno para Matrícula</h2>

    {% include 'partials/_busca.html' %}

    <div class="row g-3">
        {% for aluno in alunos %}
        <div class="col-12">
            <div class="card shadow-sm border rounded p-3 d-flex flex-row justify-content-between align-items-center">
                <div>
                    <h5 class="mb-1">{{ aluno.nome }}</h5>
                    <p class="mb-0 text-muted">Curso: {{ aluno.curso.nome }}</p>
                </div>
                <a href="{% url 'disciplinas:matricular' aluno.id %}" class="btn btn-primary">
                    Selecionar
                </a>
            </div>
        </div>
        {% empty %}
        <p class="text-center text-muted py-4">Nenhum aluno encontrado.</p>
        {% endfor %}
    </div>
</div>
{% endblock %}
