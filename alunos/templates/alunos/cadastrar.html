{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container my-4" style="max-width: 600px;">
    <h1 class="mb-4">Cadastro de Aluno</h1>

    <form method="post" enctype="multipart/form-data" novalidate class="border rounded p-4 shadow-sm bg-white">
        {% csrf_token %}
        {{ form|crispy }}

        <div class="d-grid mt-3">
            <button type="submit" class="btn btn-success btn-lg">Cadastrar Aluno</button>
        </div>
    </form>

    {% if error %}
    <div class="alert alert-danger mt-3" role="alert">
        {{ error }}
    </div>
    {% endif %}
</div>
{% endblock %}
