{% extends 'base.html' %}

{% block content %}
<div class="container my-5" style="max-width: 700px;">
    <div class="card shadow-sm p-4">
        <div class="d-flex flex-column flex-md-row align-items-center gap-4">

            <div class="flex-shrink-0 text-center">
                {% if aluno.foto %}
                <img src="{{ aluno.foto.thumb.url }}" alt="Foto de {{ aluno.nome }}"
                    class="rounded-circle border border-secondary"
                    style="width: 150px; height: 150px; object-fit: cover;">
                {% else %}
                <div class="rounded-circle bg-secondary text-white d-flex align-items-center justify-content-center"
                    style="width: 150px; height: 150px; font-size: 3rem;" title="Sem foto de {{ aluno.nome }}">
                    <i class="bi bi-person-fill"></i>
                </div>
                {% endif %}
            </div>

            <div class="flex-grow-1">
                <h2 class="mb-3">{{ aluno.nome }}</h2>
                <p><strong>Curso:</strong> {{ aluno.curso }}</p>
                <p><strong>Gênero:</strong> {{ aluno.get_genero_display }}</p>
                <p><strong>CPF:</strong> {{ aluno.cpf }}</p>
            </div>
        </div>

        <hr class="my-4" />

        <div class="d-flex justify-content-between">
            <a href="{% url 'alunos:lista' %}" class="btn btn-outline-primary">
                ← Lista de Alunos
            </a>
            <a href="{% url 'alunos:editar' aluno.id %}" class="btn btn-primary">
                Editar Aluno
            </a>
        </div>
    </div>
</div>

<!-- Bootstrap Icons CDN para o ícone de pessoa -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
{% endblock %}
